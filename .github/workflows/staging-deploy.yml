name: Deploy to Staging Environment

on:
  push:
    branches:
      - staging
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Staging VPS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEV_VPS_HOST }}
          username: ${{ secrets.DEV_VPS_USERNAME }}
          key: ${{ secrets.DEV_VPS_SSH_KEY }}
          script: |
            set -e
            
            echo "========================================="
            echo "Starting deployment to staging server"
            echo "========================================="
            
            # Navigate to project directory
            echo "Navigating to project directory..."
            cd /root/alphagranite/staging/alphagranite-backend
            
            # docker-compose.yml is per-server and untracked: keep this server's copy
            # across the pull (the pull that untracks it would otherwise delete it).
            COMPOSE_KEEP=/tmp/ag_staging_docker-compose.yml
            COMPOSE_KEPT=
            if [ -f docker-compose.yml ]; then
              cp docker-compose.yml "$COMPOSE_KEEP" && COMPOSE_KEPT=1
              git checkout -- docker-compose.yml 2>/dev/null || true
            fi

            # Pull latest changes
            echo "Pulling latest changes from Git..."
            git pull

            if [ -n "$COMPOSE_KEPT" ]; then
              cp "$COMPOSE_KEEP" docker-compose.yml
            elif [ ! -f docker-compose.yml ]; then
              echo "docker-compose.yml missing: copy docker-compose.example.yml and set this server's values"
              exit 1
            fi
            
            # Start services
            echo "Starting services..."
            docker compose --env-file .env.staging -p ag_staging up -d --build
            
            # Check container status
            echo "Checking container status..."
            docker compose --env-file .env.staging -p ag_staging ps
            
            # Show recent logs
            echo "Recent logs:"
            docker compose --env-file .env.staging -p ag_staging logs --tail=50
            
            echo "========================================="
            echo "Deployment completed successfully!"
            echo "========================================="

      - name: Notify deployment status
        if: always()
        run: |
          if [ ${{ job.status }} == 'success' ]; then
            echo "✅ Deployment successful!"
          else
            echo "❌ Deployment failed!"
          fi