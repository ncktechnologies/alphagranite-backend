x-app: &app
  image: ag-production-backend:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env.production
  entrypoint: []
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    TZ: America/Chicago
    APP_TIMEZONE: America/Chicago
    FILE_UPLOAD_ROOT: /app/static
    UPLOAD_DIR: /app/static/jobs
    STATIC_DIR: /app/static
    UPLOADS_DIR: /app/static/uploads
    BASE_URL: ${BASE_URL:?Set the production BASE_URL}
    API_BASE_URL: ${BASE_URL:?Set the production BASE_URL}
    CELERY_BROKER_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/0
    HCP_PAYROLL_SCHEDULER_ENABLED: "false"
  volumes:
    - ${STATIC_HOST_DIR:?Set a dedicated production STATIC_HOST_DIR}:/app/static
    - app_logs:/app/logs

services:
  web:
    <<: *app
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-8003}:8000"
    command: uvicorn src.app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips '*'
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      TZ: America/Chicago
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  celery_worker:
    <<: *app
    command: celery -A src.app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

  celery_beat:
    <<: *app
    command: celery -A src.app.tasks.celery_app.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  redis_data:
  app_logs: