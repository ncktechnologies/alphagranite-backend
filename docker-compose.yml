services:
  # FastAPI Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpha_granite_api
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - .env
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./static/defaults:/app/static/defaults
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
